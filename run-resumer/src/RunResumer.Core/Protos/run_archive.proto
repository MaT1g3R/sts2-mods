syntax = "proto3";

package run_resumer;

option csharp_namespace = "RunResumer.Proto";

message RunArchive {
  int32 archive_format_version = 1;
  int32 schema_version = 2;
  int64 start_time = 3;
  int32 game_mode = 4;
  bool is_custom_game = 5;
  int32 ascension = 6;
  int32 platform_type = 7;
  bool has_daily_time = 8;
  int64 daily_time_unix_seconds = 9;
  string rng_seed = 10;

  uint64 player_net_id = 11;
  uint32 player_character_id_idx = 12;
  uint64 player_rng_seed = 13;

  // Per-file string tables (1-based indices in references; 0 = null / none)
  repeated string model_ids = 14;
  repeated string prop_names = 15;
  repeated string epoch_ids = 16;

  repeated PbModifier modifiers = 17;

  // Content-deduplicated pools (1-based indices in references; 0 = null)
  repeated PbActStatic act_statics_pool = 18;
  repeated PbActMap maps_pool = 19;
  repeated PbRelicGrabBag grab_bags_pool = 20;
  repeated PbMapDrawings drawings_pool = 21;
  repeated PbDiscoverySnapshot discoveries_pool = 22;
  repeated PbCardList decks_pool = 23;
  repeated PbRelicList relics_pool = 24;
  repeated PbPotionList potions_pool = 25;

  repeated PbFloorSnapshot floors = 26;
  bool is_imported = 27;
}

message PbFloorSnapshot {
  int32 floor_num = 1;
  int32 current_act_index = 2;
  repeated PbActState acts = 3;

  PbRunOddsSet odds = 4;
  uint32 shared_grab_bag_ref_idx = 5;
  repeated PbRngEntry run_rngs = 6;
  repeated PbMapCoord visited_map_coords = 7;

  int64 save_time = 8;
  int64 run_time = 9;
  int64 win_time = 10;
  int32 num_reloads = 11;
  uint32 drawings_ref_idx = 12;
  PbExtraRunFields extra_run_fields = 13;

  PbPlayerSnapshot player = 14;
  uint32 discoveries_ref_idx = 15;
}

message PbPlayerSnapshot {
  int32 current_hp = 1;
  int32 max_hp = 2;
  int32 max_energy = 3;
  int32 max_potion_slot_count = 4;
  int32 gold = 5;
  int32 base_orb_slot_count = 6;

  uint32 deck_ref_idx = 7;
  uint32 relics_ref_idx = 8;
  uint32 potions_ref_idx = 9;

  repeated PbRngEntry player_rngs = 10;
  PbPlayerOddsSet odds = 11;
  uint32 relic_grab_bag_ref_idx = 12;
  PbExtraPlayerFields extra_fields = 13;
}

message PbDiscoverySnapshot {
  repeated uint32 events_seen_idx = 1;
  repeated uint32 unlocked_epoch_idx = 2;
  repeated uint32 encounters_seen_idx = 3;
  int32 number_of_runs = 4;
  repeated uint32 discovered_cards_idx = 5;
  repeated uint32 discovered_enemies_idx = 6;
  repeated uint32 discovered_epoch_idx = 7;
  repeated uint32 discovered_potions_idx = 8;
  repeated uint32 discovered_relics_idx = 9;
}

message PbActStatic {
  uint32 act_id_idx = 1;
  repeated uint32 event_ids_idx = 2;
  repeated uint32 normal_encounter_ids_idx = 3;
  repeated uint32 elite_encounter_ids_idx = 4;
  uint32 boss_id_idx = 5;
  uint32 second_boss_id_idx = 6;
  uint32 ancient_id_idx = 7;
}

message PbActState {
  uint32 act_static_ref_idx = 1;
  int32 events_visited = 2;
  int32 normal_encounters_visited = 3;
  int32 elite_encounters_visited = 4;
  int32 boss_encounters_visited = 5;
  uint32 saved_map_ref_idx = 6;
}

message PbActMap {
  repeated PbMapPoint points = 1;
  PbMapPoint boss_point = 2;
  bool has_second_boss = 3;
  PbMapPoint second_boss_point = 4;
  PbMapPoint starting_point = 5;
  bool has_start_map_point_coords = 6;
  repeated PbMapCoord start_map_point_coords = 7;
  int32 grid_width = 8;
  int32 grid_height = 9;
}

message PbMapPoint {
  PbMapCoord coord = 1;
  int32 point_type = 2;
  bool can_be_modified = 3;
  bool has_child_coords = 4;
  repeated PbMapCoord child_coords = 5;
}

message PbMapCoord {
  int32 col = 1;
  int32 row = 2;
}

message PbModifier {
  uint32 id_idx = 1;
  PbSavedProperties props = 2;
}

message PbCardList {
  repeated PbCard cards = 1;
}

message PbRelicList {
  repeated PbRelic relics = 1;
}

message PbPotionList {
  repeated PbPotion potions = 1;
}

message PbCard {
  uint32 id_idx = 1;
  int32 current_upgrade_level = 2;
  PbEnchantment enchantment = 3;
  PbSavedProperties props = 4;
  bool has_floor_added = 5;
  int32 floor_added_to_deck = 6;
}

message PbEnchantment {
  uint32 id_idx = 1;
  int32 amount = 2;
  PbSavedProperties props = 3;
}

message PbRelic {
  uint32 id_idx = 1;
  PbSavedProperties props = 2;
  bool has_floor_added = 3;
  int32 floor_added_to_deck = 4;
}

message PbPotion {
  uint32 id_idx = 1;
  int32 slot_index = 2;
}

message PbSavedProperties {
  repeated PbSavedInt ints = 1;
  repeated PbSavedBool bools = 2;
  repeated PbSavedString strings = 3;
  repeated PbSavedIntArray int_arrays = 4;
  repeated PbSavedModelId model_ids = 5;
  repeated PbSavedCard cards = 6;
  repeated PbSavedCardArray card_arrays = 7;
}

message PbSavedInt {
  uint32 name_idx = 1;
  int32 value = 2;
}

message PbSavedBool {
  uint32 name_idx = 1;
  bool value = 2;
}

message PbSavedString {
  uint32 name_idx = 1;
  string value = 2;
}

message PbSavedIntArray {
  uint32 name_idx = 1;
  repeated int32 values = 2;
}

message PbSavedModelId {
  uint32 name_idx = 1;
  uint32 model_id_idx = 2;
}

message PbSavedCard {
  uint32 name_idx = 1;
  PbCard value = 2;
}

message PbSavedCardArray {
  uint32 name_idx = 1;
  repeated PbCard values = 2;
}

message PbRelicGrabBag {
  repeated PbRelicRarityList buckets = 1;
}

message PbRelicRarityList {
  int32 rarity = 1;
  repeated uint32 relic_id_idx = 2;
}

message PbRngEntry {
  int32 rng_type = 1;
  int32 counter = 2;
  uint64 s0 = 3;
  uint64 s1 = 4;
  uint64 s2 = 5;
  uint64 s3 = 6;
}

message PbRunOddsSet {
  float unknown_monster_odds = 1;
  float unknown_elite_odds = 2;
  float unknown_treasure_odds = 3;
  float unknown_shop_odds = 4;
}

message PbPlayerOddsSet {
  float card_rarity_odds = 1;
  float potion_reward_odds = 2;
}

message PbExtraRunFields {
  bool started_with_neow = 1;
  int32 test_subject_kills = 2;
  bool freed_repy = 3;
  bool used_debug_command = 4;
}

message PbExtraPlayerFields {
  int32 card_shop_removals_used = 1;
  int32 wongo_points = 2;
  bool cccombo_badge_unlocked = 3;
  int32 damage_dealt = 4;
  int32 debuffs_applied = 5;
  bool is_playing_rotating_character = 6;
}

message PbMapDrawings {
  repeated PbPlayerMapDrawings drawings = 1;
}

message PbPlayerMapDrawings {
  uint64 player_id = 1;
  repeated PbMapDrawingLine lines = 2;
}

message PbMapDrawingLine {
  bool is_eraser = 1;
  repeated float points_x = 2;
  repeated float points_y = 3;
}
